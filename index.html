<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        body {
            font-family:'Times New Roman', Times, serif;
            text-align: center;
            justify-content: center;
            align-items: center;
            margin-top: 20%;
        }
        h1 {
            font-size: 16px;
            color: #ff0000;
        }
        .simple {
            font-size: 12px;
            color: #333333;
        }
        .error {
            font-size: 100px;
            color: #1a1010;
            font-weight: 900;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <p class="error">404</p>
    <h1>Page Not Found</h1>
    <p class="simple">The page you are looking for does not exist.</p>
</body>
</html>
